<!DOCTYPE html>

<body>
    <header>
        <div class = "header-container"> 
            <div class = "logo">
                <img src = "Chrono Studios Logo.png" alt=" Company Logo">
            </div> 

            <div class="social-media">
                <a href = "https://youtube.com" target = "_blank" rel = "noopener noreferrer">
                    <i class = "fab fa-youtube"></i>
                </a>  
                <a href = "https://twitter.com" target = "_blank" rel = "noopener noreferrer">
                    <i class = "fab fa-twitter"></i>
                </a>
                <a href = "https://discord.com" target = "_blank" rel = "noopener noreferrer">
                    <i class = "fab fa-discord"></i>
                </a>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href = "index.html">Home</a></li>
                <li><a href = "team.html">Team</a></li>
                <li><a href = "games.html">Games</a></li>
                <li><a href = "news.html">News</a></li>
                <li><a href = "contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="games-section">
    <!-- Game Section 1 -->
        <section class="game-container">
            <div class="game-image">
                <img src="ProjectChrono.png" alt="Game Cover Art">
            </div>
            <div class="game-info">
                <img src="Chrono.svg" alt="Game Logo" class="game-logo">
                <p class="game-description">
                    Description about what our video game is.
                </p>
                <p class="coming-soon">Coming Soon</p>
            </div>
        </section>

        <!-- Game Section 2 -->
        <section class="game-container">
            <div class="game-image">
                <img src="ProjectBeyond.png" alt="Game Cover Art">
            </div>

            <div class="game-info">
                <img src="Maverick.svg" alt="Game Logo" class="game-logo">
                <p class="game-description">
                    Description about what our video game is.
                </p>

                <p class="available-now">Available Now:</p>

                <div class="platforms">
                    <a href="https://store.steampowered.com/" target="_blank">
                        <img src="Steam.svg" alt="Steam" class="platform-logo">
                    </a>

                    <a href="https://www.playstation.com/" target="_blank">
                        <img src="Playstation.svg" alt="PlayStation" class="platform-logo">
                    </a>

                    <a href="https://www.xbox.com/" target="_blank">
                        <img src="Xbox.svg" alt="Xbox" class="platform-logo">
                    </a>

                    <a href="https://www.nintendo.com/" target="_blank">
                        <img src="Nintendo.svg" alt="Nintendo" class="platform-logo">
                    </a>
                </div>
            </div>
        </section>
    </main>

            <div class = "footer-nav">
                <ul>
                    <li><a href = "index.html">Home</a></li>
                    <li><a href = "team.html">Team</a></li>

                    <li><a href = "news.html">News</a></li>
                    <li><a href = "contact.html">Contact</a></li>
                </ul>

            <div class = "footer-social">
